<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Wynn animated GitHub profile banner</title>
  <desc id="desc">Animated gradient banner introducing Wynn as an independent developer and AI explorer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3977df">
        <animate attributeName="stop-color" values="#3977df;#6655d8;#3977df" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#7a6fc0">
        <animate attributeName="stop-color" values="#7a6fc0;#9a69bf;#7a6fc0" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f19a68">
        <animate attributeName="stop-color" values="#f19a68;#f07c72;#f19a68" dur="10s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="0;0.22;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.72;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce8ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#fff1e6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textShimmer" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="0.42" stop-color="#fffaf4"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fff2cf"/>
      <stop offset="1" stop-color="#fffaf4"/>
      <animate attributeName="x1" values="-1;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4.8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#243047" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>

  <g>
    <ellipse cx="1010" cy="55" rx="250" ry="180" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-115 34;0 0" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="165" cy="128" rx="190" ry="150" fill="url(#glow)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="0 0;95 -28;0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#ffffff">
    <circle cx="108" cy="70" r="3" opacity="0.46">
      <animate attributeName="cy" values="70;55;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.76;0.28" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="102" r="4" opacity="0.42">
      <animate attributeName="cy" values="102;84;102" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.72;0.22" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="52" r="2.5" opacity="0.5">
      <animate attributeName="cy" values="52;39;52" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M-70 222 C150 192 295 258 515 224 C750 187 944 190 1130 226 L1270 300 L-70 300 Z" fill="url(#wave)" opacity="0.86">
    <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M-80 248 C158 220 336 286 575 247 C800 210 964 239 1120 260 L1280 300 L-80 300 Z" fill="#ffffff" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;80 0;0 0" dur="13s" repeatCount="indefinite"/>
  </path>

  <g fill="url(#textShimmer)" filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="118" text-anchor="middle" font-size="58" font-weight="750">Hi, I’m Wynn
      <animate attributeName="opacity" values="0.94;1;0.94" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="170" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="1.1">INDEPENDENT DEVELOPER · AI EXPLORER · PRODUCT BUILDER</text>
  </g>
</svg>
