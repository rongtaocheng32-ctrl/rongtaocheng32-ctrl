<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Wynn GitHub profile banner</title>
  <desc id="desc">Gradient banner introducing Wynn as an independent developer and AI explorer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4477d4"/>
      <stop offset="0.52" stop-color="#8078ba"/>
      <stop offset="1" stop-color="#f19a68"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce8ff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#fff1e6" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#243047" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1050" cy="42" r="130" fill="#fff" opacity="0.06"/>
  <circle cx="1120" cy="160" r="190" fill="#fff" opacity="0.05"/>
  <path d="M0 222 C220 192 365 258 585 224 C820 187 1014 190 1200 226 L1200 300 L0 300 Z" fill="url(#wave)"/>
  <path d="M0 248 C238 220 416 286 655 247 C880 210 1044 239 1200 260 L1200 300 L0 300 Z" fill="#ffffff" opacity="0.72"/>
  <g fill="#fffaf4" filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="118" text-anchor="middle" font-size="58" font-weight="750">Hi, I’m Wynn</text>
    <text x="600" y="170" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="1.1">INDEPENDENT DEVELOPER · AI EXPLORER · PRODUCT BUILDER</text>
  </g>
</svg>
